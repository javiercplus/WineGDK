name: Build Portable WineGDK (WoW64)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Enable 32-bit architecture and install multilib dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y flex bison build-essential gcc-multilib g++-multilib mingw-w64
        sudo apt-get install -y libx11-dev:i386 libx11-dev libfreetype6-dev:i386 libfreetype6-dev

    - name: Create isolated build directories
      run: |
        mkdir build-wine64
        mkdir build-wine32

    - name: Configure and compile 64-bit architecture
      working-directory: ./build-wine64
      run: |
        ../configure --enable-win64 --disable-tests --prefix=${{ github.workspace }}/winegdk-portable
        make -j$(nproc)

    - name: Configure and compile 32-bit architecture linked to 64-bit
      working-directory: ./build-wine32
      run: |
        ../configure --with-wine64=../build-wine64 --disable-tests --prefix=${{ github.workspace }}/winegdk-portable
        make -j$(nproc)

    - name: Build combined portable directory
      run: |
        make -C ./build-wine32 install
        make -C ./build-wine64 install

    - name: Compress portable artifact
      run: tar -czvf winegdk-wow64-portable.tar.gz -C ${{ github.workspace }}/winegdk-portable .

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: winegdk-wow64-portable-archive
        path: winegdk-wow64-portable.tar.gz
